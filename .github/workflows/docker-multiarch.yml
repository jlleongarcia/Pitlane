name: CI/CD — Test & Publish Multi-Arch Image

# Replaces the old CICD-GHA_MultiArch.yml / ci-cd.yml / github-runner.yml,
# which built a since-removed Streamlit app. Those three were near-duplicates
# of each other and never actually ran a test
# suite before publishing; this one gates the image build on the frontend
# checks and a smoke test of the built image. See README.md's "CI/CD" section.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run frontend tests
        working-directory: frontend
        run: npm run test

      - name: Type-check and build
        working-directory: frontend
        run: npm run build

  smoke-test:
    # Builds the image (amd64 only, not pushed) and runs scripts/smoke-test.sh
    # against it: the nginx rules for MIME types, PWA cache headers and 404s
    # fail silently if broken, so they're checked against a real container.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: pitlane:smoke
          # Own cache scope, so this single-arch build doesn't overwrite the
          # multi-arch cache build-and-push relies on.
          cache-from: type=gha,scope=smoke
          cache-to: type=gha,scope=smoke,mode=max

      - name: Run smoke test
        run: ./scripts/smoke-test.sh pitlane:smoke

  build-and-push:
    needs: [test-frontend, smoke-test]
    # Only publish from an actual push/tag/manual run -- never from a pull_request
    # (a PR, especially from a fork, shouldn't publish images, and forked PRs
    # don't get package-write access to secrets/GITHUB_TOKEN anyway).
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # GITHUB_TOKEN, not a manually-created PAT -- it's scoped to this
          # repo, expires automatically, and needs no setup beyond the
          # `packages: write` permission above (the old workflows required
          # creating and rotating a personal access token by hand).
          password: ${{ secrets.GITHUB_TOKEN }}

      # GHCR requires an all-lowercase image path; github.repository preserves
      # the repo's actual case (e.g. "SomeUser/PitLane"), which would
      # otherwise make the push fail.
      - name: Compute lowercase image name
        id: image
        run: echo "name=${REPO,,}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}

      - name: Extract image metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,prefix=,format=short

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
