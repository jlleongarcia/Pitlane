# Static-file server for the built frontend. Every compute-heavy feature
# (trim, join, telemetry extraction, lap detection, HUD rendering,
# compositing) runs client-side in the browser -- see frontend/src/lib/ --
# so serving dist/ is all the server has left to do.
#
# Replaces the image's stock /etc/nginx/conf.d/default.conf. The base image
# (nginx-unprivileged) runs as uid 101, so it can't bind below 1024; 7000
# keeps docker-compose.yml and Tailscale access unchanged.
# scripts/smoke-test.sh checks every rule below against a running container.

server {
    listen 7000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    # Directory redirects (e.g. /foo -> /foo/) stay relative, so they still
    # work when the host port mapped in front of 7000 is a different one.
    absolute_redirect off;

    # mime.types (included at http level) has application/wasm -- which
    # libde265 needs for WebAssembly.instantiateStreaming -- but not
    # .webmanifest. A `types` block here would *replace* the inherited map
    # instead of adding to it, so the whole map is re-included first.
    include /etc/nginx/mime.types;
    types {
        application/manifest+json webmanifest;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/css
        application/javascript
        application/json
        application/manifest+json
        application/wasm
        image/svg+xml;

    # Kept from the old FastAPI backend, and used by the Dockerfile's HEALTHCHECK.
    location = /api/health {
        access_log off;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 200 '{"status":"ok"}';
    }

    # Vite puts a content hash in every filename under assets/, so a given
    # URL's bytes never change -- safe to cache forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else (index.html, sw.js, manifest.webmanifest, icons) keeps
    # a fixed name across releases and must be revalidated on every load
    # (cheap: the ETag usually just returns a 304). If index.html or sw.js
    # were cached for long, clients would stay on an old build and the
    # PWA's update prompt (src/pwa/UpdateToast.tsx) would never show.
    # No SPA fallback to index.html: the app has no client-side routes, and
    # a missing .js file should get a real 404, not HTML.
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ =404;
    }
}
